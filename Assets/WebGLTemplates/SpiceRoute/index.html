<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #04070a; overflow: hidden; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; background: #04070a; outline: none; }
      #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 60%, #1a2a33 0%, #070b0f 55%, #030507 100%);
        color: #e8c57a; font-family: Georgia, 'Times New Roman', serif; transition: opacity 1.2s ease; z-index: 10; }
      #loader .t0 { font-size: clamp(10px, 1.1vw, 14px); letter-spacing: 0.6em; color: #8d8471; margin-bottom: 18px; padding-left: 0.6em; }
      #loader .t1 { font-size: clamp(30px, 5.4vw, 74px); letter-spacing: 0.32em; padding-left: 0.32em; text-shadow: 0 0 30px rgba(232,180,90,0.35); }
      #loader .t2 { font-size: clamp(11px, 1.3vw, 17px); letter-spacing: 0.55em; color: #cbbd9b; margin: 14px 0 46px 0; padding-left: 0.55em; }
      #loader .bar { width: min(440px, 70vw); height: 2px; background: #252d33; position: relative; overflow: hidden; }
      #loader .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0%; background: linear-gradient(90deg, #8a5d1c, #ffd884); box-shadow: 0 0 12px #ffcc66; transition: width 0.2s; }
      #loader .hint { margin-top: 20px; font-size: 12px; letter-spacing: 0.3em; color: #7d786c; font-style: italic; }
      #loader .quote { position: absolute; bottom: 7vh; font-size: 14px; color: #6f6a5f; letter-spacing: 0.15em; font-style: italic; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loader">
      <div class="t0">GAME OFF 2026 &middot; SHIFT</div>
      <div class="t1">THE SPICE ROUTE</div>
      <div class="t2">THE MALABAR EXPEDITION</div>
      <div class="bar"><div class="fill" id="fill"></div></div>
      <div class="hint" id="hint">Loading the trade winds&hellip;</div>
      <div class="quote">&ldquo;The sea remembers every journey.&rdquo;</div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var fill = document.getElementById("fill");
      var hint = document.getElementById("hint");
      var hints = ["Loading the trade winds…", "Caulking the hull…", "Weighing the pepper…", "Reading the monsoon…", "Polishing the bronze compass…"];
      var hintTimer = setInterval(function () { hint.textContent = hints[Math.floor(Math.random() * hints.length)]; }, 2200);
      window.spiceRouteHideLoader = function () {
        var l = document.getElementById("loader");
        if (!l) return;
        clearInterval(hintTimer);
        l.style.opacity = "0";
        setTimeout(function () { if (l.parentNode) l.parentNode.removeChild(l); }, 1300);
      };
      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_THREADS
        workerUrl: "Build/{{{ WORKER_FILENAME }}}",
#endif
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      }, function (progress) {
        fill.style.width = Math.round(progress * 92) + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance;
        fill.style.width = "100%";
        hint.textContent = "Raising the sails…";
      }).catch(function (message) {
        hint.textContent = "Error: " + message;
      });
    </script>
  </body>
</html>
